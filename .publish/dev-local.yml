# devutil dev-link package map: local checkouts overlaid onto node_modules after
# install, only when DEV_LOCAL=true and not CI. Paths are relative to this
# workspace root. pnpm always installs the PUBLISHED graph first, so a package
# listed here must exist on the registry (at least as a pre-release) before the
# overlay has anything to repoint.
packages:
  "@myrddraall/mpq": ../mpq/packages/mpq
  "@cpdevtools/git-flow": ../git-flow/packages/git-flow
  "@cpdevtools/git-flow-cli": ../git-flow/packages/git-flow-cli
  "@cpdevtools/ts-dev-utilities": ../ts-dev-utilities/packages/ts-dev-utilities
  "@cpdevtools/ts-dev-utilities-cli": ../ts-dev-utilities/packages/cli
